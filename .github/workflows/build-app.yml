name: Build Atoll App

on:
  push:
    branches:
      - slider-brightness-hud
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Atoll Application
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ]; then
            sudo xcodebuild -downloadComponent MetalToolchain || true
          else
            echo "macOS $MAJOR: Metal ships with Xcode, skipping download."
          fi

      - name: Build Application
        run: |
          sudo DevToolsSecurity -enable

          # Strip mach-services entitlement for ad-hoc signing
          if ! plutil_out=$(plutil -remove com.apple.security.mach-services DynamicIsland/DynamicIsland.entitlements 2>&1); then
            if printf '%s' "$plutil_out" | grep -q "No value to remove"; then
              echo "mach-services entitlement already absent, continuing."
            else
              echo "::error::plutil failed to modify entitlements: $plutil_out"
              exit 1
            fi
          fi

          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -derivedDataPath ./build \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES

      - name: Copy Resources & Sign Bundle
        run: |
          APP_DIR="./build/Build/Products/Release/Atoll.app"
          APP_RESOURCES="${APP_DIR}/Contents/Resources"
          SRC_DIR="DynamicIsland/BluetoothHUDAnimations"
          if [ -d "$SRC_DIR" ]; then
            mkdir -p "$APP_RESOURCES"
            cp -R "$SRC_DIR" "$APP_RESOURCES/"
          fi
          # Ad-hoc sign the universal bundle
          codesign --force --deep --sign - "$APP_DIR"

      - name: Upload Atoll Application
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-Mac-Universal
          path: ./build/Build/Products/Release/Atoll.app
          retention-days: 14
